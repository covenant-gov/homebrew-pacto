name: release-bump

# Verifies and merges the cask bump PR that covenant-gov/pacto-app's release
# workflow opens, so a published release reaches brew users without a human
# merging anything. Every gate below must pass; the release job in pacto-app
# waits on this merge and goes red if it does not happen.
#
# Credential boundary: untrusted validation (PR checkout + brew install of the
# PR-controlled cask) runs in `verify` with no contents:write. Merge/close run
# in a separate `merge` job that never checks out PR code, never installs the
# cask, and revalidates exact PR/commit identity before using write privileges.
# GitHub Actions permissions are workflow- or job-scoped only (not per-step).

on:
  pull_request:
    branches: [main]
    paths: ['Casks/pacto.rb']

# Default least privilege. Jobs that need more declare it explicitly below.
permissions:
  contents: read

concurrency:
  group: release-bump
  cancel-in-progress: false

env:
  CASK: Casks/pacto.rb
  HEAD_REF: ${{ github.head_ref }}
  HEAD_SHA: ${{ github.event.pull_request.head.sha }}
  PR: ${{ github.event.pull_request.number }}
  UPSTREAM: covenant-gov/pacto-app

jobs:
  verify:
    if: startsWith(github.head_ref, 'chore/bump-v') && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: macos-latest
    # Read tree + comment on failure. No merge-capable write token — brew
    # install of PR-controlled cask must not share credentials that can merge.
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false

      - name: Only the cask may change
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "only the cask may change" > "$RUNNER_TEMP/gate.txt"
          changed="$(gh api --paginate "repos/$GITHUB_REPOSITORY/pulls/$PR/files" --jq '.[].filename')"
          if [ "$changed" != "$CASK" ]; then
            echo "This PR must change $CASK and nothing else. Changed:"
            printf '%s\n' "$changed"
            exit 1
          fi

      - name: Cask version is a newer published release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "cask version is a newer published release" > "$RUNNER_TEMP/gate.txt"
          TAG="${HEAD_REF#chore/bump-}"
          VERSION="$(sed -n 's/^  version "\(.*\)"$/\1/p' "$CASK")"
          if [ -z "$VERSION" ]; then
            echo "Could not read the version stanza from $CASK."
            exit 1
          fi
          if [ "$VERSION" != "${TAG#v}" ]; then
            echo "Cask version $VERSION does not match branch tag $TAG."
            exit 1
          fi
          read -r release_tag is_draft is_prerelease <<<"$(
            gh release view "$TAG" --repo "$UPSTREAM" \
              --json tagName,isDraft,isPrerelease --jq '[.tagName, .isDraft, .isPrerelease] | @tsv'
          )"
          if [ "$release_tag" != "$TAG" ] || [ "$is_draft" != "false" ] || [ "$is_prerelease" != "false" ]; then
            echo "$UPSTREAM $TAG is not a published, non-draft, non-prerelease release (tag=$release_tag draft=$is_draft prerelease=$is_prerelease)."
            exit 1
          fi
          git fetch --depth=1 origin "$GITHUB_BASE_REF"
          base_version="$(git show "FETCH_HEAD:$CASK" | sed -n 's/^  version "\(.*\)"$/\1/p')"
          if [ "$VERSION" = "$base_version" ] ||
             [ "$(printf '%s\n%s\n' "$VERSION" "$base_version" | sort -V | head -n 1)" != "$base_version" ]; then
            echo "Cask version $VERSION is not newer than $GITHUB_BASE_REF's $base_version; refusing to downgrade the tap."
            exit 1
          fi
          echo "TAG=$TAG" >> "$GITHUB_ENV"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"

      - name: Checksums match the DMGs the cask points at
        run: |
          echo "checksums match the DMGs the cask points at" > "$RUNNER_TEMP/gate.txt"
          url_template="$(sed -n 's/^  url "\(.*\)"$/\1/p' "$CASK")"
          arm_slug="$(sed -n 's/^  arch arm: "\([^"]*\)".*/\1/p' "$CASK")"
          intel_slug="$(sed -n 's/^  arch .*intel: "\([^"]*\)".*/\1/p' "$CASK")"
          arm_sha="$(sed -n 's/.*arm:[[:space:]]*"\([0-9a-f]\{64\}\)".*/\1/p' "$CASK" | head -n 1)"
          intel_sha="$(sed -n 's/.*intel:[[:space:]]*"\([0-9a-f]\{64\}\)".*/\1/p' "$CASK" | head -n 1)"
          for value in "$url_template" "$arm_slug" "$intel_slug" "$arm_sha" "$intel_sha"; do
            if [ -z "$value" ]; then
              echo "Could not parse the url, arch or sha256 stanzas from $CASK."
              exit 1
            fi
          done
          check() {
            local slug="$1" expected="$2" url
            url="${url_template//\#\{version\}/$VERSION}"
            url="${url//\#\{arch\}/$slug}"
            echo "Downloading $url"
            curl --fail --silent --show-error --location --retry 3 -o "$RUNNER_TEMP/$slug.dmg" "$url"
            local actual
            actual="$(shasum -a 256 "$RUNNER_TEMP/$slug.dmg" | cut -d' ' -f1)"
            rm -f "$RUNNER_TEMP/$slug.dmg"
            if [ "$actual" != "$expected" ]; then
              echo "sha256 mismatch for $slug: cask says $expected, download is $actual."
              exit 1
            fi
            echo "$slug sha256 verified."
          }
          check "$arm_slug" "$arm_sha"
          check "$intel_slug" "$intel_sha"

      - name: Tap the checkout for brew
        run: |
          tap_dir="$(brew --repository)/Library/Taps/${GITHUB_REPOSITORY%%/*}/${GITHUB_REPOSITORY#*/}"
          mkdir -p "$(dirname "$tap_dir")"
          rm -rf "$tap_dir"
          ln -s "$GITHUB_WORKSPACE" "$tap_dir"
          echo "CASK_TOKEN=${GITHUB_REPOSITORY%%/*}/pacto/pacto" >> "$GITHUB_ENV"

      - name: Trust the release cask
        run: |
          echo "trust the release cask" > "$RUNNER_TEMP/gate.txt"
          brew trust --cask "$CASK_TOKEN"

      - name: brew style and audit
        run: |
          echo "brew style and audit" > "$RUNNER_TEMP/gate.txt"
          brew style --cask "$CASK_TOKEN"
          brew audit --cask --strict --online "$CASK_TOKEN"

      - name: Install and uninstall the cask
        run: |
          echo "install and uninstall the cask" > "$RUNNER_TEMP/gate.txt"
          app="$(sed -n 's/^  app "\(.*\)"$/\1/p' "$CASK")"
          brew install --cask "$CASK_TOKEN"
          if [ ! -d "/Applications/$app" ]; then
            echo "/Applications/$app is missing after install."
            exit 1
          fi
          brew uninstall --cask "$CASK_TOKEN"

      - name: Report the failing gate
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gate="$(cat "$RUNNER_TEMP/gate.txt" 2>/dev/null || echo 'setup')"
          gh pr comment "$PR" --repo "$GITHUB_REPOSITORY" --body "$(
            printf '%s\n\n%s\n' \
              "Cask verification failed at the gate: **${gate}**. This PR stays open and unmerged." \
              "Log: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          )"

  merge:
    needs: verify
    if: startsWith(github.head_ref, 'chore/bump-v') && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    # Write privileges live only here. No PR checkout, no brew, no artifacts
    # from verify — identity is re-read from the API + workflow event context.
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Revalidate identity and merge the verified commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "merge the verified commit" > "$RUNNER_TEMP/gate.txt"
          # Do not trust job outputs or artifacts from verify for merge identity.
          TAG="${HEAD_REF#chore/bump-}"
          echo "TAG=$TAG" >> "$GITHUB_ENV"
          read -r head_sha head_repo head_ref pr_state pr_merged <<<"$(
            gh api "repos/$GITHUB_REPOSITORY/pulls/$PR" \
              --jq '[.head.sha, .head.repo.full_name, .head.ref, .state, .merged] | @tsv'
          )"
          if [ "$pr_merged" = "true" ]; then
            echo "PR #$PR is already merged; nothing to do."
            exit 0
          fi
          if [ "$pr_state" != "open" ]; then
            echo "PR #$PR is $pr_state; refusing to merge."
            exit 1
          fi
          if [ "$head_sha" != "$HEAD_SHA" ]; then
            echo "PR head moved ($head_sha != $HEAD_SHA); refusing to merge a different commit than verify checked."
            exit 1
          fi
          if [ "$head_repo" != "$GITHUB_REPOSITORY" ]; then
            echo "PR head repo $head_repo is not $GITHUB_REPOSITORY; refusing fork merge."
            exit 1
          fi
          case "$head_ref" in
            chore/bump-v*) ;;
            *)
              echo "PR head ref $head_ref is not a chore/bump-v* branch; refusing to merge."
              exit 1
              ;;
          esac
          if [ "$head_ref" != "$HEAD_REF" ]; then
            echo "PR head ref changed ($head_ref != $HEAD_REF); refusing to merge."
            exit 1
          fi
          changed="$(gh api --paginate "repos/$GITHUB_REPOSITORY/pulls/$PR/files" --jq '.[].filename')"
          if [ "$changed" != "$CASK" ]; then
            echo "PR no longer changes only $CASK. Changed:"
            printf '%s\n' "$changed"
            exit 1
          fi
          read -r release_tag is_draft is_prerelease <<<"$(
            gh release view "$TAG" --repo "$UPSTREAM" \
              --json tagName,isDraft,isPrerelease --jq '[.tagName, .isDraft, .isPrerelease] | @tsv'
          )"
          if [ "$release_tag" != "$TAG" ] || [ "$is_draft" != "false" ] || [ "$is_prerelease" != "false" ]; then
            echo "$UPSTREAM $TAG is not a published, non-draft, non-prerelease release (tag=$release_tag draft=$is_draft prerelease=$is_prerelease)."
            exit 1
          fi
          gh pr merge "$PR" --repo "$GITHUB_REPOSITORY" --squash --delete-branch \
            --match-head-commit "$HEAD_SHA"

      - name: Close superseded bump PRs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh pr list --repo "$GITHUB_REPOSITORY" --state open --limit 100 \
            --json number,headRefName \
            --jq '.[] | select(.headRefName | startswith("chore/bump-v")) | [.number, .headRefName] | @tsv' \
            | while IFS=$'\t' read -r number head_ref; do
                other_tag="${head_ref#chore/bump-}"
                if [ "$other_tag" = "$TAG" ] || [ "$(printf '%s\n%s\n' "$other_tag" "$TAG" | sort -V | head -n 1)" != "$other_tag" ]; then
                  continue
                fi
                echo "Closing superseded #$number ($head_ref)."
                gh pr close "$number" --repo "$GITHUB_REPOSITORY" --delete-branch \
                  --comment "Superseded by $TAG, which is now on main."
              done
